<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA MOD 圖層實際預覽（Q版／成人版）</title>
<style>body{font:16px system-ui;background:#f6f1fc;color:#30243b;max-width:980px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:16px;margin:12px 0}canvas{width:min(100%,420px);aspect-ratio:1;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/24px 24px}label{display:block;margin:8px 0}button,select,input{font:inherit}small{color:#694e83}</style>
<h1>NOVA 角色 MOD 分層驗收台</h1><p>本工具不包含官方角色圖；請匯入原始透明 PNG。只在瀏覽器記憶體中預覽，不上傳圖片。Q 版與成人版分開保存圖層狀態。</p>
<section><label>角色版本 <select id="variant"><option value="chibi">Q 版</option><option value="adult">成人版</option></select></label>
<label>圖層類型 <select id="slot"></select></label>
<label>匯入透明 PNG <input id="file" type="file" accept="image/png"></label>
<label><input id="visible" type="checkbox" checked> 顯示此圖層</label>
<button id="clear">移除此圖層</button> <button id="export">匯出合成 PNG</button>
<p id="status" role="status"></p></section>
<section><canvas id="stage" width="512" height="512" aria-label="角色圖層預覽"></canvas><p><small>圖層以 512×512 相同畫布座標疊合；請使用對齊的透明 PNG。空圖層會自動隱藏；頭型、眼睛、嘴巴、帽子可獨立替換。若上衣與下裝未同時提供，保留 base_clothes 基本服裝圖層。</small></p></section>
<script>
'use strict';
/* Back-to-front paint order; preserve legacy 'head'/'face' MOD slots. */
const slots=['hair_back','body','base_clothes','bottom','top','outer','shoes','head','head_shape','face','eyes','mouth','hair_front','hat','accessory','full_character'];
const state={chibi:{},adult:{}};
const $=id=>document.getElementById(id),slot=$('slot'),variant=$('variant'),stage=$('stage'),ctx=stage.getContext('2d');
for(const s of slots){const o=document.createElement('option');o.value=s;o.textContent=s;slot.append(o)}
function current(){return state[variant.value][slot.value]}
function update(){const x=current();$('visible').checked=x?x.visible:false;draw()}
function isActive(v,s){return variant.value===v&&slot.value===s}
function visibleLayers(character){
  const full=character.full_character;
  if(full&&full.visible&&full.image)return [full];
  /* A coat or a single garment is not a complete outfit. Keep the safe base
     underneath until both upper and lower clothing are supplied and visible. */
  const hasCompleteOutfit=['top','bottom'].every(s=>character[s]?.visible&&character[s]?.image);
  return slots.filter(s=>s!=='full_character'&&(s!=='base_clothes'||!hasCompleteOutfit))
    .map(s=>character[s]).filter(x=>x?.visible&&x.image);
}
function draw(){ctx.clearRect(0,0,512,512);const layers=visibleLayers(state[variant.value]);
for(const x of layers)ctx.drawImage(x.image,0,0,512,512);
$('status').textContent=variant.value+'：'+layers.length+' 個實際顯示圖層';}
slot.onchange=variant.onchange=update;
$('visible').onchange=()=>{const x=current();if(x)x.visible=$('visible').checked;draw()};
const pendingImports={chibi:{},adult:{}};
$('clear').onclick=()=>{const v=variant.value,s=slot.value;pendingImports[v][s]=(pendingImports[v][s]||0)+1;delete state[v][s];$('file').value='';update()};
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;
// Snapshot the destination before any await: switching version/slot mid-load must not misfile a MOD.
const targetVariant=variant.value,targetSlot=slot.value,sequence=(pendingImports[targetVariant][targetSlot]||0)+1;
pendingImports[targetVariant][targetSlot]=sequence;
if(file.type!=='image/png'){$('status').textContent='僅接受 PNG';return}
try{const url=URL.createObjectURL(file);const img=new Image();try{await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url})}finally{URL.revokeObjectURL(url)}
if(sequence!==pendingImports[targetVariant][targetSlot])return;
if(!img.width||!img.height)throw Error('空白尺寸');
if(img.width>4096||img.height>4096||img.width*img.height>16777216)throw Error('PNG 尺寸超過 4096×4096 限制');
const probe=document.createElement('canvas');probe.width=img.width;probe.height=img.height;
const pctx=probe.getContext('2d',{willReadFrequently:true});pctx.drawImage(img,0,0);
const pixels=pctx.getImageData(0,0,img.width,img.height).data;
let nonempty=false;for(let i=3;i<pixels.length;i+=4){if(pixels[i]>0){nonempty=true;break}}
if(sequence!==pendingImports[targetVariant][targetSlot])return;
if(!nonempty){delete state[targetVariant][targetSlot];if(isActive(targetVariant,targetSlot)){$('file').value='';update();$('status').textContent='透明空圖層已自動隱藏'}return}
state[targetVariant][targetSlot]={image:img,visible:true};if(isActive(targetVariant,targetSlot)){update();$('status').textContent=targetVariant+'/'+targetSlot+'：PNG 匯入成功'}else{draw()}}catch(e){if(sequence===pendingImports[targetVariant][targetSlot]&&isActive(targetVariant,targetSlot))$('status').textContent='圖片載入失敗：'+e.message}};
$('export').onclick=()=>{draw();const a=document.createElement('a');a.download='nova-'+variant.value+'-composite.png';a.href=stage.toDataURL('image/png');a.click()};
update();
</script>
