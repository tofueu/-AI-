<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <g id="nova-purple-character">
    <!-- Speech Bubble / Status Indicator -->
    <rect x="15" y="2" width="70" height="22" rx="8" fill="#241d3d" stroke="#a38aff" stroke-width="1.5"/>
    <text x="50" y="16" fill="#e6deff" font-family="DM Sans, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">NOVA</text>

    <!-- Halo Star / Crown -->
    <polygon points="50,28 53,36 61,36 55,41 57,49 50,44 43,49 45,41 39,36 47,36" fill="#ffd166"/>

    <!-- Main Purple Silhouette Body -->
    <path fill="#7b2cbf" stroke="#c77dff" stroke-width="2.5" d="M 50 44 C 70 44 78 61 76 78 C 74 92 32 92 24 78 C 22 61 30 44 50 44 Z"/>

    <!-- Character Eyes -->
    <ellipse cx="39" cy="58" rx="3.5" ry="5" fill="#ffffff"/>
    <ellipse cx="61" cy="58" rx="3.5" ry="5" fill="#ffffff"/>
    <ellipse cx="40" cy="59" rx="1.8" ry="2.5" fill="#10002b"/>
    <ellipse cx="62" cy="59" rx="1.8" ry="2.5" fill="#10002b"/>

    <!-- Cheeks / Blush -->
    <ellipse cx="33" cy="66" rx="4" ry="2.5" fill="#ff9eaf" opacity="0.8"/>
    <ellipse cx="67" cy="66" rx="4" ry="2.5" fill="#ff9eaf" opacity="0.8"/>

    <!-- Mouth -->
    <path d="M 45 70 Q 50 74 55 70" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
