name: NOVA Windows PowerShell regression

on:
  pull_request:
    paths:
      - 'nova.ps1'
      - 'nova-tasks.ps1'
      - 'tests/nova-tasks-regression.ps1'
      - 'tests/nova-startup-regression.ps1'
      - 'start.bat'
      - '.github/workflows/nova-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nova-json:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actual Windows PowerShell 5.1 parser regressions
        shell: powershell
        run: .\tests\nova-tasks-regression.ps1
      - name: Verify NOVA integrated startup and PowerShell syntax
        shell: powershell
        run: .\tests\nova-startup-regression.ps1
