name: AI Workbench OpenCode and provider checks
on:
  push:
    branches:
      - 'feat/opencode-provider-failover-*'
  pull_request:
    paths:
      - 'lib/model-router.js'
      - 'tests/model-router.test.js'
      - 'server.js'
      - 'public/**'
      - '.github/workflows/model-router-ci.yml'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check lib/model-router.js
      - run: node --check public/app.js
      - run: npm test
