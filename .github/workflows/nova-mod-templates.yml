name: NOVA MOD template tests

on:
  push:
    branches:
      - feature/nova-pet-core-mod-v1
    paths:
      - 'nova/tools/make_mod_templates.py'
      - 'nova/tests/test_mod_template_generation.py'
      - '.github/workflows/nova-mod-templates.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Compile generator and tests
        run: python -m py_compile nova/tools/make_mod_templates.py nova/tests/test_mod_template_generation.py
      - name: Run MOD template regressions
        run: python -m unittest discover -s nova/tests -p 'test_mod_template_generation.py' -v
